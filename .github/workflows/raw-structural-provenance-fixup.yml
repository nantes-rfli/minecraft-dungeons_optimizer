name: Raw Structural Provenance Fixup

on:
  push:
    branches: [codex/raw-structural-inventory]

permissions:
  contents: write

jobs:
  fixup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/raw-structural-inventory
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund --timing
        timeout-minutes: 10
      - name: Rewrite committed provenance only
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto'
          import fs from 'node:fs'
          import path from 'node:path'
          import { gzipSync, gunzipSync } from 'node:zlib'
          import {
            RAW_STRUCTURAL_CODE_PATHS,
            RAW_STRUCTURAL_INPUT_PATHS,
            RAW_STRUCTURAL_INVENTORY_PATH,
            RAW_STRUCTURAL_REPORT_PATH,
            makeRawStructuralCodeIdentity,
            makeRawStructuralInputIdentity,
            makeRawStructuralPackageRunId,
            renderRawStructuralInventoryReport,
            serializeRawStructuralInventoryManifest,
          } from './scripts/game-data-raw-structural-inventory.ts'

          const root = process.cwd()
          const manifestPath = path.join(root, RAW_STRUCTURAL_INVENTORY_PATH)
          const artifactDirectory = path.dirname(manifestPath)
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'))
          const codeIdentity = makeRawStructuralCodeIdentity(root)
          const inputIdentity = makeRawStructuralInputIdentity(root)
          const scope = manifest.scope
          manifest.scope = {
            game: scope.game,
            claimedGameVersion: scope.claimedGameVersion,
            claimedGameVersionStatus: scope.claimedGameVersionStatus,
            dataset: scope.dataset,
            parser: scope.parser,
            codeIdentity,
            inputIdentity,
            traversalPolicy: scope.traversalPolicy,
            seedResolutionPolicy: scope.seedResolutionPolicy,
            semanticInterpretation: scope.semanticInterpretation,
            rawBinaryBytes: scope.rawBinaryBytes,
            generatedFrom: [
              'local-game-data/QuickBMS 1.17.0.0 package paths and serialized identifiers',
              'research/sources/game-data-source-provenance.json',
              ...RAW_STRUCTURAL_INPUT_PATHS,
              ...RAW_STRUCTURAL_CODE_PATHS,
            ],
          }

          const sha256 = (bytes) => crypto.createHash('sha256').update(bytes).digest('hex')
          for (const shardMeta of manifest.shards) {
            const shardPath = path.join(artifactDirectory, shardMeta.path)
            const shard = JSON.parse(gunzipSync(fs.readFileSync(shardPath)).toString('utf8'))
            for (const pkg of shard.packages) {
              pkg.parse.codeIdentity = codeIdentity
              pkg.parse.runId = makeRawStructuralPackageRunId({
                datasetId: manifest.scope.dataset.id,
                packagePath: pkg.path,
                sourceFiles: pkg.sourceFiles,
                codeIdentity,
                state: pkg.parse.state,
                ...(pkg.parse.failure ? { failureMessage: pkg.parse.failure.message } : {}),
              })
            }
            const plain = Buffer.from(`${JSON.stringify(shard, null, 2)}\n`, 'utf8')
            const compressed = gzipSync(plain, { level: 9 })
            compressed.fill(0, 4, 8)
            compressed[9] = 255
            fs.writeFileSync(shardPath, compressed)
            shardMeta.uncompressedBytes = plain.byteLength
            shardMeta.uncompressedSha256 = sha256(plain)
            shardMeta.compressedBytes = compressed.byteLength
            shardMeta.compressedSha256 = sha256(compressed)
          }

          fs.writeFileSync(manifestPath, serializeRawStructuralInventoryManifest(manifest))
          fs.writeFileSync(
            path.join(root, RAW_STRUCTURAL_REPORT_PATH),
            renderRawStructuralInventoryReport({ ...manifest, packages: [], edges: [] }),
          )
          NODE
      - run: npm run audit:game-data-raw-structural-inventory
      - run: npm test -- --run tests/gameDataRawStructuralInventory.test.ts
      - run: npx tsc --noEmit --pretty false
      - run: npm run lint
      - name: Commit provenance-only artifact refresh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/raw/game-data-raw-structural-inventory docs/game-data-raw-structural-inventory.md
          git diff --cached --quiet && exit 0
          git commit -m "Refresh structural inventory run provenance"
          git push origin HEAD:codex/raw-structural-inventory
