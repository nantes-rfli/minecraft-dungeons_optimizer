name: Validate reviewed identity bridges final

on:
  push:
    branches: [codex/reviewed-identity-bridges]

permissions:
  contents: write

jobs:
  validate-final-head:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 20
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund --timing
        timeout-minutes: 10
      - name: Regenerate authoritative artifacts
        shell: bash
        run: |
          set -euo pipefail
          npm run generate:game-data-model-alignment
          npm run generate:formal-identity-evidence
          npm run audit:game-data-model-alignment
          npm run audit:formal-identity-evidence
          npx vitest run tests/formalIdentityEvidence.test.ts tests/formalIdentitySourceGrounding.test.ts
      - name: Verify existing 49 Formal identities are unchanged
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'
          import { execFileSync } from 'node:child_process'
          const baseline = JSON.parse(execFileSync('git', ['show', '647fcaefed2a8b90372fcc1e5f1297371ae0ee9d:research/domain/formal/identity-evidence-v1.json'], { encoding: 'utf8' }))
          const current = JSON.parse(fs.readFileSync('research/domain/formal/identity-evidence-v1.json', 'utf8'))
          assert.equal(baseline.identityAssertions.length, 49)
          assert.deepEqual(current.identityAssertions.slice(0, 49), baseline.identityAssertions)
          assert.deepEqual(current.semantic.identities.slice(0, 49), baseline.semantic.identities)
          assert.deepEqual(current.provenance.evidence.slice(0, baseline.provenance.evidence.length), baseline.provenance.evidence)
          console.log('Existing 49 Formal identities/evidence preserved exactly.')
          NODE
      - name: Commit regenerated artifacts and retire temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          allowed='^( M|M |A | D|D ) (research/domain/game-data-entity-aliases.json|research/domain/formal/identity-evidence-v1.json|.github/workflows/reviewed-identity-bridges-final-validate.yml)$'
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            if ! grep -Eq "$allowed" <<<"$line"; then
              echo "Unexpected generated diff: $line"
              exit 1
            fi
          done < <(git status --porcelain)
          rm .github/workflows/reviewed-identity-bridges-final-validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/domain/game-data-entity-aliases.json research/domain/formal/identity-evidence-v1.json .github/workflows/reviewed-identity-bridges-final-validate.yml
          git diff --cached --check
          git commit -m "Regenerate reviewed identity bridge artifacts"
          git push origin HEAD:codex/reviewed-identity-bridges
          echo "Final head: $(git rev-parse HEAD)"
      - name: Full repository Validate
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:damage-events
          npm run audit:dot-damage
          npm run audit:temporal-enchants
          npm run audit:soul
          npm run audit:cc
          npm run audit:charge-enchants
          npm run audit:enchants
          npm run audit:artifacts
          npm run audit:artifact-control
          npm run audit:artifact-soul
          npm run audit:artifact-event
          npm run audit:artifact-evidence
          npm run audit:armor
          npm run audit:armor-enchants
          npm run audit:armor-runtime
          npm run audit:armor-expansion
          npm run audit:runtime-support
          npm run audit:dps
          npm run audit:melee
          npm run audit:ranged
          npm run audit:ranged-enchants
          npm run audit:ranged-runtime
          npm run audit:evidence-coverage
          npm run audit:source-harvest
          npm run audit:evidence-gap-map
          npm run audit:coverage-priority
          npm run audit:game-data-inventory
          npm run audit:game-data-provenance
          npm run audit:game-data-extractor
          npm run audit:game-data-raw-package
          npm run audit:game-data-raw-structural-inventory
          npm run audit:formal-identity-evidence
          npm run audit:formal-value-availability
          npm run audit:formal-serialized-relation
          npm run audit:formal-integration
          npm run audit:game-data-semantic-mapping
          npm run audit:game-data-bulk-harvest
          npm run audit:game-data-gap-reconciliation
          npm run audit:game-data-final-coverage
          npm run audit:game-data-model-alignment
          npm run audit:game-data-native-analysis
          npm run audit:external-community
          npm run audit:evidence-adapter
          npm run audit:attack-event-comparison
          npm run audit:dr-modifier-comparison
          npm run audit:scenario-optimizer-comparison
          npm run audit:runtime-promotion
          npm run audit:roadmap
          npm test
          git diff --exit-code -- README.md ROADMAP.md docs research
          npx tsc -b
          npm run lint
          npm run build
      - name: E2E
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Final determinism and preservation
        shell: bash
        run: |
          set -euo pipefail
          npm run generate:game-data-model-alignment
          npm run generate:formal-identity-evidence
          git diff --exit-code
          git diff --check
          if git diff --name-only 647fcaefed2a8b90372fcc1e5f1297371ae0ee9d...HEAD | grep -Eq '^(research/native/|docs/native-analysis-restart.md)'; then
            echo "Native Analysis changed unexpectedly"
            exit 1
          fi
          echo "Deterministic artifacts clean; Native Analysis unchanged."
