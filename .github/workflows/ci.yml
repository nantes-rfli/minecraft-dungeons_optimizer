name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

# A PR can receive several commits while validation is still running.
# Keep only the newest PR-head run so obsolete heads do not consume hosted-runner minutes.
# Push and manual runs use a unique fallback group and are never canceled by this policy.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Formal preservation audits read committed historical baselines.
          fetch-depth: 0
          # A pull_request run defaults to a synthetic merge SHA. Test the actual PR head.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Confirm validated commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          echo "Validating commit $actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        # Reuse cached package data; still install exactly the lockfile on every run.
        # The advisory API can stall for minutes; dependency-audit.yml reports it separately.
        run: npm ci --prefer-offline --no-audit --no-fund --timing
        timeout-minutes: 10
      # TEMPORARY PR #213 fix-up capture. Remove after committing these canonical generator outputs.
      - name: Generate runtime-derived artifacts for fix-up capture
        run: |
          npm run audit:armor
          npm run generate:evidence-coverage
          npm run harvest:sources
          npm run generate:project-status
      - name: Upload runtime-derived fix-up artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pr213-runtime-derived-fixup
          path: |
            PROJECT_STATUS.md
            docs/armor-audit.md
            docs/armor-runtime-support.md
            docs/combined-evidence-coverage.md
            docs/evidence-gap-map.md
            docs/measurement-protocols.md
            docs/runtime-limitations.md
            docs/source-harvest.md
            research/analysis/evidence-coverage.json
            research/analysis/evidence-coverage-dashboard.json
            research/evidence-gap-map.json
            research/source-harvest.json
            research/source-harvest-browser.json
            research/workflow/measurement-protocols.json
          retention-days: 1
      - name: Commit canonical generated fix-up
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          paths=(
            PROJECT_STATUS.md
            docs/armor-audit.md
            docs/armor-runtime-support.md
            docs/combined-evidence-coverage.md
            docs/evidence-gap-map.md
            docs/measurement-protocols.md
            docs/runtime-limitations.md
            docs/source-harvest.md
            research/analysis/evidence-coverage.json
            research/analysis/evidence-coverage-dashboard.json
            research/evidence-gap-map.json
            research/source-harvest.json
            research/source-harvest-browser.json
            research/workflow/measurement-protocols.json
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo "Canonical generator outputs already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${paths[@]}"
          git commit -m "docs: sync Armor runtime generated artifacts"
          git push origin "HEAD:${PR_BRANCH}"
      - run: npm run audit:damage-events
      - run: npm run audit:dot-damage
      - run: npm run audit:temporal-enchants
      - run: npm run audit:soul
      - run: npm run audit:cc
      - run: npm run audit:charge-enchants
      - run: npm run audit:enchants
      - run: npm run audit:artifacts
      - run: npm run audit:artifact-control
      - run: npm run audit:artifact-soul
      - run: npm run audit:artifact-event
      - run: npm run audit:artifact-evidence
      - run: npm run audit:armor
      - run: npm run audit:armor-enchants
      - run: npm run audit:armor-runtime
      - run: npm run audit:armor-expansion
      - run: npm run audit:runtime-support
      - run: npm run audit:dps
      - run: npm run audit:melee
      - run: npm run audit:ranged
      - run: npm run audit:ranged-enchants
      - run: npm run audit:ranged-runtime
      - run: npm run audit:evidence-coverage
      - run: npm run audit:source-harvest
      - run: npm run audit:evidence-gap-map
      - run: npm run audit:coverage-priority
      - run: npm run audit:game-data-inventory
      - run: npm run audit:game-data-provenance
      - run: npm run audit:game-data-extractor
      - run: npm run audit:game-data-raw-package
      - run: npm run audit:game-data-raw-structural-inventory
      - run: npm run audit:game-data-horizontal-fact-inventory
      - run: npm run audit:formal-identity-evidence
      - run: npm run audit:formal-value-availability
      - run: npm run audit:formal-serialized-relation
      - run: npm run audit:formal-integration
      - run: npm run audit:game-data-semantic-mapping
      - run: npm run audit:game-data-bulk-harvest
      - run: npm run audit:game-data-gap-reconciliation
      - run: npm run audit:game-data-final-coverage
      - run: npm run audit:game-data-model-alignment
      - run: npm run audit:game-data-native-analysis
      - run: npm run audit:external-community
      - run: npm run audit:evidence-adapter
      - run: npm run audit:attack-event-comparison
      - run: npm run audit:dr-modifier-comparison
      - run: npm run audit:scenario-optimizer-comparison
      - run: npm run audit:runtime-promotion
      - run: npm run audit:phase7-research-quest
      - run: npm run audit:roadmap
      - run: npm run audit:project-status
      - run: npm test
      - run: git diff --exit-code -- PROJECT_STATUS.md README.md ROADMAP.md docs research
      - run: npx tsc -b
      - run: npm run lint

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The push E2E decision needs HEAD^; PR validation uses its exact head.
          # PR path classification compares the exact base and head, so retain history.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Confirm validated commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          echo "Validating commit $actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund --timing
        timeout-minutes: 10
      - run: npm run build
      - name: Decide whether E2E is needed
        id: e2e
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            changed_files="$(git diff --name-only "$base" "$head")"
          else
            changed_files="$(git diff --name-only HEAD^ HEAD)"
          fi

          run_e2e=false
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              *.md|.github/*) ;;
              *) run_e2e=true; break ;;
            esac
          done <<< "$changed_files"

          echo "run=$run_e2e" >> "$GITHUB_OUTPUT"
      - run: npx playwright install --with-deps chromium
        if: ${{ steps.e2e.outputs.run == 'true' }}
      - run: npm run test:e2e
        if: ${{ steps.e2e.outputs.run == 'true' }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.e2e.outputs.run == 'true' }}
        with:
          name: browser-validation
          path: |
            playwright-report/
            test-results/
          retention-days: 14
