name: Validate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run audit:damage-events
      - run: npm run audit:enchants
      - run: npm run audit:dps
      - run: npm run audit:melee
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run build
