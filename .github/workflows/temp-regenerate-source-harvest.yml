name: Temporary Source Harvest Regeneration

on:
  push:
    branches:
      - feature/armor-thief-limited-runtime-main-20261011

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run harvest:sources
      - name: Commit generated harvest and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/source-harvest.json research/source-harvest-browser.json docs/source-harvest.md
          git rm .github/workflows/temp-regenerate-source-harvest.yml
          git commit -m "chore(harvest): regenerate source harvest"
          git push origin "HEAD:${GITHUB_REF_NAME}"
