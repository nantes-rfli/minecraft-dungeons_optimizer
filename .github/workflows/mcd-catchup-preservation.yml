name: Temporary Formal Catch-up Preservation

on:
  push:
    branches:
      - feat/formal-value-relation-catchup-8-20260928
    paths:
      - .github/workflows/mcd-catchup-preservation.yml

permissions:
  contents: read

jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify baseline preservation
        env:
          BASELINE_SHA: 904cec2edc2e76f5b1356ba8b64ed90fc717574b
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet "$BASELINE_SHA" -- research/domain/formal/identity-evidence-v1.json; then
            echo "Formal Identity artifact changed unexpectedly"
            exit 1
          fi

          if ! git diff --quiet "$BASELINE_SHA" -- research/raw; then
            echo "Raw Structural / Raw research content changed unexpectedly"
            git diff --name-only "$BASELINE_SHA" -- research/raw
            exit 1
          fi

          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'
          import { execFileSync } from 'node:child_process'

          const base = process.env.BASELINE_SHA
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'))
          const readBase = (path) => JSON.parse(execFileSync(
            'git',
            ['show', `${base}:${path}`],
            { encoding: 'utf8', maxBuffer: 128 * 1024 * 1024 },
          ))

          const targets = [
            'broken-sawblade',
            'mechanized-sawblade',
            'chill-gale-knife',
            'resolute-tempest-knife',
            'bonebow',
            'twin-bow',
            'burst-gale-bow',
            'echo-of-the-valley',
          ].sort()

          const identity = read('research/domain/formal/identity-evidence-v1.json')
          assert.equal(identity.semantic.identities.length, 152, 'Formal Identity count changed')

          const valuePath = 'research/domain/formal/value-availability-v2.json'
          const oldValue = readBase(valuePath)
          const value = read(valuePath)
          const oldValueDomains = [
            ...Object.keys(oldValue.semantic.melee),
            ...Object.keys(oldValue.semantic.ranged),
          ]
          const valueDomains = [
            ...Object.keys(value.semantic.melee),
            ...Object.keys(value.semantic.ranged),
          ]
          assert.equal(oldValueDomains.length, 50)
          assert.equal(valueDomains.length, 58)
          assert.equal(Object.keys(value.semantic.melee).length, 31)
          assert.equal(Object.keys(value.semantic.ranged).length, 27)

          const oldValueSet = new Set(oldValueDomains)
          assert.deepEqual(
            valueDomains.filter((id) => !oldValueSet.has(id)).sort(),
            targets,
            'Value additions differ from reviewed catch-up set',
          )

          for (const category of ['melee', 'ranged']) {
            for (const [domainId, domain] of Object.entries(oldValue.semantic[category])) {
              assert.deepEqual(
                value.semantic[category][domainId],
                domain,
                `${domainId}: existing Value semantic changed`,
              )
            }
          }

          const currentValueProjection = new Map(
            value.valueProjections.map((record) => [record.projectionId, record]),
          )
          for (const record of oldValue.valueProjections) {
            assert.deepEqual(
              currentValueProjection.get(record.projectionId),
              record,
              `${record.projectionId}: existing Value projection changed`,
            )
          }

          const currentValueEvidence = new Map(
            value.provenance.evidence.map((record) => [record.id, record]),
          )
          for (const record of oldValue.provenance.evidence) {
            assert.deepEqual(
              currentValueEvidence.get(record.id),
              record,
              `${record.id}: existing Value evidence changed`,
            )
          }

          const relationPath = 'research/domain/formal/serialized-relation-v2.json'
          const oldRelation = readBase(relationPath)
          const relation = read(relationPath)

          assert.equal(oldRelation.semantic.relations.length, 121)
          assert.equal(relation.semantic.relations.length, 135)
          assert.equal(oldRelation.relationProjections.length, 121)
          assert.equal(relation.relationProjections.length, 135)
          assert.equal(oldRelation.relationCollections.length, 50)
          assert.equal(relation.relationCollections.length, 58)

          const oldSourceDomains = new Set(
            oldRelation.semantic.relations.map((record) => record.sourceDomainId),
          )
          const sourceDomains = new Set(
            relation.semantic.relations.map((record) => record.sourceDomainId),
          )
          assert.equal(oldSourceDomains.size, 52)
          assert.equal(sourceDomains.size, 60)
          assert.deepEqual(
            [...sourceDomains].filter((id) => !oldSourceDomains.has(id)).sort(),
            targets,
            'Relation source-domain additions differ from reviewed catch-up set',
          )

          const oldSemanticByProjection = new Map(
            oldRelation.semantic.relations.map((record) => [record.projectionRef, record]),
          )
          const semanticByProjection = new Map(
            relation.semantic.relations.map((record) => [record.projectionRef, record]),
          )
          for (const [projectionRef, record] of oldSemanticByProjection) {
            assert.deepEqual(
              semanticByProjection.get(projectionRef),
              record,
              `${projectionRef}: existing Relation semantic changed`,
            )
          }

          const oldProjectionByRef = new Map(
            oldRelation.relationProjections.map((record) => [record.projectionRef, record]),
          )
          const projectionByRef = new Map(
            relation.relationProjections.map((record) => [record.projectionRef, record]),
          )
          for (const [projectionRef, record] of oldProjectionByRef) {
            assert.deepEqual(
              projectionByRef.get(projectionRef),
              record,
              `${projectionRef}: existing Relation projection changed`,
            )
          }

          const addedRelationRecords = relation.relationProjections.filter(
            (record) => !oldProjectionByRef.has(record.projectionRef),
          )
          assert.equal(addedRelationRecords.length, 14)
          assert.deepEqual(
            [...new Set(addedRelationRecords.map((record) => record.occurrence.domainId))].sort(),
            targets,
            'New Relation records are not limited to reviewed catch-up domains',
          )

          const collectionKey = (record) => `${record.domainId}\0${record.collectionRef}`
          const collectionByKey = new Map(
            relation.relationCollections.map((record) => [collectionKey(record), record]),
          )
          for (const record of oldRelation.relationCollections) {
            assert.deepEqual(
              collectionByKey.get(collectionKey(record)),
              record,
              `${collectionKey(record)}: existing Relation collection changed`,
            )
          }

          const relationEvidenceById = new Map(
            relation.provenance.evidence.map((record) => [record.id, record]),
          )
          for (const record of oldRelation.provenance.evidence) {
            assert.deepEqual(
              relationEvidenceById.get(record.id),
              record,
              `${record.id}: existing Relation provenance changed`,
            )
          }

          console.log('Preservation passed: existing 50 Value domains and 121 Relation records are unchanged; additions are exactly 8 domains / 14 relation records.')
          NODE
