name: Validate reviewed typed-relation bridges

on:
  push:
    branches: [codex/reviewed-typed-relation-bridges]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund --timing
        timeout-minutes: 10
      - name: Generate reviewed alias and Formal Identity artifacts
        run: |
          npm run generate:game-data-model-alignment
          npm run generate:formal-identity-evidence
          git diff --check
      - name: Commit generated artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs research
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "research: regenerate reviewed identity artifacts"
            git push
          fi
      - name: Focused reviewed bridge validation
        run: |
          npm run audit:game-data-model-alignment
          npm run audit:formal-identity-evidence
          npx vitest run tests/gameDataModelAlignment.test.ts tests/formalIdentityEvidence.test.ts tests/formalIdentitySourceGrounding.test.ts
          npx tsc -b
          npm run lint
      - run: npm run audit:damage-events
      - run: npm run audit:dot-damage
      - run: npm run audit:temporal-enchants
      - run: npm run audit:soul
      - run: npm run audit:cc
      - run: npm run audit:charge-enchants
      - run: npm run audit:enchants
      - run: npm run audit:artifacts
      - run: npm run audit:artifact-control
      - run: npm run audit:artifact-soul
      - run: npm run audit:artifact-event
      - run: npm run audit:artifact-evidence
      - run: npm run audit:armor
      - run: npm run audit:armor-enchants
      - run: npm run audit:armor-runtime
      - run: npm run audit:armor-expansion
      - run: npm run audit:runtime-support
      - run: npm run audit:dps
      - run: npm run audit:melee
      - run: npm run audit:ranged
      - run: npm run audit:ranged-enchants
      - run: npm run audit:ranged-runtime
      - run: npm run audit:evidence-coverage
      - run: npm run audit:source-harvest
      - run: npm run audit:evidence-gap-map
      - run: npm run audit:coverage-priority
      - run: npm run audit:game-data-inventory
      - run: npm run audit:game-data-provenance
      - run: npm run audit:game-data-extractor
      - run: npm run audit:game-data-raw-package
      - run: npm run audit:game-data-raw-structural-inventory
      - run: npm run audit:game-data-horizontal-fact-inventory
      - run: npm run audit:formal-identity-evidence
      - run: npm run audit:formal-value-availability
      - run: npm run audit:formal-serialized-relation
      - run: npm run audit:formal-integration
      - run: npm run audit:game-data-semantic-mapping
      - run: npm run audit:game-data-bulk-harvest
      - run: npm run audit:game-data-gap-reconciliation
      - run: npm run audit:game-data-final-coverage
      - run: npm run audit:game-data-model-alignment
      - run: npm run audit:game-data-native-analysis
      - run: npm run audit:external-community
      - run: npm run audit:evidence-adapter
      - run: npm run audit:attack-event-comparison
      - run: npm run audit:dr-modifier-comparison
      - run: npm run audit:scenario-optimizer-comparison
      - run: npm run audit:runtime-promotion
      - run: npm run audit:roadmap
      - run: npm test
      - run: git diff --exit-code -- README.md ROADMAP.md docs research
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Remove temporary validation workflow
        shell: bash
        run: |
          git rm .github/workflows/validate-reviewed-typed-relation-bridges.yml
          git commit -m "chore: remove temporary bridge validation workflow"
          git push
