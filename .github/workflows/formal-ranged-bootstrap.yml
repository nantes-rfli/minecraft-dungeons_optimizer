name: Formal Ranged Bootstrap

on:
  push:
    branches:
      - feat/formal-identity-ranged-breadth
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:formal-identity-evidence
      - run: npm run audit:formal-identity-evidence
      - run: npx vitest run tests/formalIdentityEvidence.test.ts tests/formalIdentitySourceGrounding.test.ts
      - name: Commit generated Formal Identity artifact
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- research/domain/formal/identity-evidence-v1.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/domain/formal/identity-evidence-v1.json
          git commit -m "Generate Ranged Formal Identity evidence artifact"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: formal-ranged-generated
          path: research/domain/formal/identity-evidence-v1.json
